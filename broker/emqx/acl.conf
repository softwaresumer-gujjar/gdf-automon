%% GDF-AutoMon EMQX ACL Rules
%% Format: {allow|deny, all|{user,"username"}, pub|sub|pubsub, ["topic"]}.

%% Backend service: can subscribe to all gdf/# topics
{allow, {user, "gdf_backend"}, subscribe, ["gdf/#"]}.
{allow, {user, "gdf_backend"}, publish, ["gdf/commands/#"]}.

%% Realtime gateway: can subscribe to all gdf/# topics
{allow, {user, "gdf_realtime"}, subscribe, ["gdf/#"]}.

%% Sensor devices: can only publish to their own topic
%% Pattern: gdf/{sensor_id}/# — enforced by username matching sensor_id
%% In production: use EMQX built_in_database with per-device credentials
{allow, all, publish, ["gdf/#"]}.

%% Deny everything else
{deny, all}.
