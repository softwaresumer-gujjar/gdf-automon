## GDF-AutoMon EMQX 5.x Configuration
## Docs: https://www.emqx.io/docs/en/v5/configuration/configuration-manual.html

node {
  name = "emqx@127.0.0.1"
  cookie = "gdf_secret_cookie"
  data_dir = "/opt/emqx/data"
}

cluster {
  name = gdfcluster
  discovery_strategy = manual
}

## Listeners
listeners.tcp.default {
  bind = "0.0.0.0:1883"
  max_connections = 1024000
}

listeners.ssl.default {
  bind = "0.0.0.0:8883"
  ssl_options {
    cacertfile = "/opt/emqx/etc/certs/cacert.pem"
    certfile   = "/opt/emqx/etc/certs/cert.pem"
    keyfile    = "/opt/emqx/etc/certs/key.pem"
  }
}

listeners.ws.default {
  bind = "0.0.0.0:8083"
  websocket.path = "/mqtt"
  max_connections = 1024000
}

listeners.wss.default {
  bind = "0.0.0.0:8084"
  websocket.path = "/mqtt"
  ssl_options {
    cacertfile = "/opt/emqx/etc/certs/cacert.pem"
    certfile   = "/opt/emqx/etc/certs/cert.pem"
    keyfile    = "/opt/emqx/etc/certs/key.pem"
  }
}

## Authentication — allow anonymous in dev, restrict in prod
# For production: set up file-based or built-in database auth
authentication = [
  {
    mechanism = password_based
    backend = built_in_database
    user_id_type = username
  }
]

## Authorization
authorization {
  no_match = allow
  deny_action = ignore
  cache { enable = true }
  sources = [
    {
      type = file
      path = "/opt/emqx/etc/acl.conf"
    }
  ]
}

## MQTT Settings
mqtt {
  max_packet_size = 1MB
  max_qos_allowed = 2
  retain_available = true
  session_expiry_interval = 7200s
  max_inflight = 32
}

## Dashboard
dashboard {
  listeners.http {
    bind = 18083
  }
  default_username = "admin"
  default_password = "gdf_admin_2024"
}
