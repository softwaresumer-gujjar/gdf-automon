version: "3.9"

# Development overrides — run with:
# docker compose -f docker-compose.yml -f docker-compose.dev.yml up

services:
  backend:
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    volumes:
      - ../backend:/app

  realtime:
    volumes:
      - ../realtime:/app
      - /app/node_modules
    command: npx tsx watch src/index.ts
